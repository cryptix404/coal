<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cryptix404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: black;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            position: relative;
        }
        
        .fake-message {
            color: #0a0a0a;
            font-size: 18px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
            margin: 20px;
            word-break: break-word;
        }
        
        .hidden-key {
            color: #000000;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-top: 50px;
            user-select: text;
        }
        
        img {
            max-width: 80%;
            margin-top: 30px;
            border: 1px solid #111;
        }
    </style>
</head>
<body>
    <!-- Первый слой: фальшивка -->
    <div class="fake-message">
        VGhpcyBpcyBub3Qgd2hhdCB5b3UncmUgbG9va2luZyBmb3IuIExvb2sgZGVlcGVyLg==
    </div>
    
    <!-- Второй слой: невидимый ключ STONE -->
    <div class="hidden-key">
        STONE
    </div>
    
    <!-- Картинка со скрытым ключом OBSIDIAN -->
    <img src="image.png" alt=" " />
</body>
</html>
